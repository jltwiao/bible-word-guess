<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bible Word Guess</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

</div>

    <div class="container">
        <header>
            <h1>Bible Word Guess</h1>
            <p></p>
        </header>
        <div class="guess_word" id="guess_word">

        </div>
        <div class="guesses_container" id="guesses_container">
            <h2>Your Guesses</h2>
            <div class="guesses" id="guesses"></div>
        </div>
        <div hidden class="message" id="message"></div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <h2 id="modalTitle"></h2>
                <p id="modalMessage"></p>
                <div class="word-meaning">
                    <h3>Definition</h3>
                    <div id="wordMeaning">Loading meaning...</div>
                </div>
                <button id="copyResults" type="button">
                    Copy Results
                </button>
            </div>
        </div>
        <div class="guess_input" id = "guess_input"></div>
        <div class="keyboard" id="keyboard">
            <!-- Keyboard will be generated by JavaScript -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
